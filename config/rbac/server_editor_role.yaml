# This rule is not used by the project mso itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the minecraft.mso.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mso
    app.kubernetes.io/managed-by: kustomize
  name: server-editor-role
rules:
- apiGroups:
  - minecraft.mso.io
  resources:
  - servers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - minecraft.mso.io
  resources:
  - servers/status
  verbs:
  - get
